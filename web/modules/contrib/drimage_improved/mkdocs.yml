site_name: "Dynamic Responsive Image (Drimage) - Improved"
repo_url: https://www.drupal.org/project/drimage_improved
repo_name: drupal/drimage_improved
edit_uri: /-/edit/1.0.x/docs/

theme:
  name: material
  language: en
  logo: logo.png
  # favicon: favicon.ico
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: indigo
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: indigo
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: indigo
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections

nav:
  - Introduction: "index.md"
  - User Documentation:
      - Installation and Setup: "1-users/0-installation.md"
      - Image Fields: "1-users/1-image-fields.md"
      - Media References: "1-users/2-media-references.md"
  - Administrator Documentation:
      - Configuration: "2-admins/0-configuration.md"
      - Image Handling: "2-admins/1-image-handling.md"
      - WebP Images: "2-admins/2-webp.md"
  - Developer Documentation:
      - Architecture Overview: "3-developers/0-architecture.md"
      - Testing: "3-developers/1-testing.md"
  - Frequently Asked Questions: "faq.md"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

drimage_improved.settings:
  type: config_object
  label: 'Drimage settings'
  mapping:
    threshold:
      type: integer
      label: 'Minimum difference per image style'
    ratio_distortion:
      type: integer
      label: 'Maximum allowed ratio distortion'
    upscale:
      type: integer
      label: 'Minimum image style width'
    downscale:
      type: integer
      label: 'Maximum image style width'
    multiplier:
      type: integer
      label: 'Enable device pixel ratio detection'
    lazy_offset:
      type: integer
      label: 'Lazyloader offset'
    core_webp:
      type: boolean
      label: 'Support for webp through Core'
    imageapi_optimize_webp:
      type: boolean
      label: 'Support for webp through the imageapi_optimize_webp module'
    automated_crop:
      type: string
      label: 'Support for automated_crop module'
    fallback_style:
      type: string
      label: 'Fallback Image Style'
    cache_max_age:
      type: integer
      label: 'Cache maximum age'
    placeholder_color:
      type: string
      label: 'Color placeholder'
    placeholder_image_switch:
      type: boolean
      label: 'Use image as placeholder'
    placeholder_image:
      type: string
      label: 'Image placeholder'
    legacy_lazyload:
      type: boolean
      label: 'Use drimage_improved JS lazyloader'

# Field formatter settings for the Drimage responsive image formatter.
field.formatter.settings.drimage_improved:
  type: field.formatter.settings.image
  label: 'Drimage formatter settings'
  mapping:
    image_handling:
      type: string
      label: 'Image handling'
    fetchpriority:
      type: string
      label: 'Fetch priority'
    aspect_ratio:
      type: mapping
      label: 'Aspect ratio'
      mapping:
        width:
          type: integer
          label: 'Width'
        height:
          type: integer
          label: 'Height'
    background:
      type: mapping
      label: 'Background'
      mapping:
        attachment:
          type: string
          label: 'Attachment'
        position:
          type: string
          label: 'Position'
        size:
          type: string
          label: 'Size'
    iwc:
      type: mapping
      label: 'Image widget crop'
      mapping:
        image_style:
          type: string
          label: 'Image style'
          nullable: true

services:
  realname.config_cache_tag:
    class: Drupal\realname\EventSubscriber\ConfigCacheTag
    arguments: ['@cache_tags.invalidator']
    tags:
      - { name: event_subscriber }

  realname.route.subscriber:
    class: Drupal\realname\Routing\RealnameRouteSubscriber
    tags:
      - { name: event_subscriber }

  realname.pattern_renderer:
    class: Drupal\realname\PatternRenderer
    arguments: ['@token', '@twig', '@logger.channel.realname']

  logger.channel.realname:
    parent: logger.channel_base
    arguments: ['realname']

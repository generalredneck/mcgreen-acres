name: 'McGreen Acres Square Sync'
type: module
description: 'Pulls in-person Square sales from Square, and links or imports them as Drupal orders.'
package: 'McGreen Acres'
core_version_requirement: ^11 || ^12
configure: mcgreen_square_sync.settings
dependencies:
  - commerce:commerce_order
  - commerce:commerce_payment
  - commerce:commerce_price
  - commerce:commerce_product
  - commerce_reports:commerce_reports
  - commerce_stock:commerce_stock
  - key:key

schema_version: "1.1"
name: installed-only
expected_outcome: |
  Packages that are in vendor/ but whose modules are not enabled (according to config/sync/core.extension.yml) are filtered out with filter_installed.py before any release notes are fetched; they are listed under 'Not covered' with the dependent that pulls them in, and any constraint they place on covered projects is mentioned. Packages with no module (e.g. drupal/coder) and composer metapackages of enabled modules are kept.
---
tags: [skill-creator]
max_turns: 60
timeout_seconds: 1800
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, WebFetch, Agent]

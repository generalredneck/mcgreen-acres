schema_version: "1.1"
name: security-advisories
expected_outcome: |
  security_advisories.py check is run on the filtered package list; the Security column cites the SA ids and risk levels for projects whose installed version is affected, shows the minimum fixing release, flags any advisory the latest release does not fix as most urgent, mentions the date range the RSS feed covered, and lists advisory lookup failures or undetermined ranges instead of dropping them.
---
tags: [skill-creator]
max_turns: 60
timeout_seconds: 1800
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, WebFetch, Agent]

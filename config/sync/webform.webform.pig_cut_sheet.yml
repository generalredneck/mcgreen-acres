id: pig_cut_sheet
title: 'Pig Cut Sheet'
description: "Customer-facing cut sheet for customer-owned hogs. The option lists are Hess Meat Market's options (Cut sheet option lists at /admin/structure/webform/config/options). To use another processor, edit those lists; the keys marked as a contract in the mcgreen_cut_sheet README must keep their meaning. Set the slaughter date by changing the default value of the Slaughter date element."
categories:
  - Meat
elements: |-
  intro:
    '#type': webform_markup
    '#markup': '<p class="lead">Choose how your hog should be cut. We send your sheet to the processor on slaughter day, and the processor will contact you directly if anything needs clarifying.</p>'
  charges_notice:
    '#type': webform_message
    '#message_type': info
    '#message_message': '<p>This form shows no prices. Some choices can add processor charges, and the processor sets the final price. Choices that can add charges include boneless chops, cutlets, smoke and cure, peppered bacon, more than one sausage type, and splitting a hog in half.</p>'
  card_customer:
    '#type': webform_section
    '#title': Your information
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    customer_pair_1:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      customer_name:
        '#type': textfield
        '#title': Your name
        '#required': true
      customer_email:
        '#type': email
        '#title': Your email
        '#required': true
        '#description': We email you a copy of your cut sheet.
    customer_pair_2:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      customer_cell_phone:
        '#type': tel
        '#title': Cell phone
        '#required': true
      customer_backup_phone:
        '#type': tel
        '#title': Backup phone
  card_hog:
    '#type': webform_section
    '#title': Your hog
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    hog_type:
      '#type': radios
      '#title': Whole hog or half hog?
      '#required': true
      '#options':
        whole: Whole hog
        half: Half hog
    half_hog_note:
      '#type': webform_message
      '#states':
        visible:
          ':input[name="hog_type"]':
            value: half
      '#message_type': info
      '#message_message': '<p>A half hog has one of each part. You will only see questions marked 1 (loin 1, shoulder 1, ham 1 and bacon slab 1).</p>'
    hog_pair:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      other_half_owner:
        '#type': textfield
        '#title': 'Who owns the other half? '
        '#description': '<p>(Filled in by McGreen Acres). The processor uses this to match two halves to one hog.</p>'
        '#states':
          visible:
            ':input[name="hog_type"]':
              value: half
      slaughter_date:
        '#type': date
        '#title': Slaughter date
        '#default_value': '2026-12-02'
        '#readonly': true
        '#description': Set by us for this batch.
  card_loins:
    '#type': webform_section
    '#title': Loins and spare ribs
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    loins_help:
      '#type': webform_markup
      '#markup': '<p class="cut-sheet-help">Each loin is cut one way only: all bone-in chops or all boneless chops. Choosing boneless chops lets you keep the tenderloin and baby back ribs. Sizes are optional. Leave one blank and the processor uses its default.</p>'
    loins_same:
      '#type': checkbox
      '#title': Cut both loins the same way
      '#states':
        visible:
          ':input[name="hog_type"]':
            value: whole
    loin_pair:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      loin_1:
        '#type': fieldset
        '#title': Loin 1
        '#attributes':
          class:
          - cut-sheet-part
        loin_1_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_loin_cut
          '#required': true
          '#admin_title': 'Loin 1: cut'
          '#required_error': 'Loin 1: cut is required.'
        loin_1_chop_size:
          '#type': textfield
          '#title': Chop thickness and count per package
          '#placeholder': e.g. 1 inch thick, 2 per package
          '#admin_title': 'Loin 1: chop thickness and count per package'
        loin_1_tenderloin:
          '#type': radios
          '#title': Tenderloin
          '#options': cut_sheet_keep_or_grind
          '#required': true
          '#states':
            visible:
              ':input[name="loin_1_cut"]':
                value: boneless
          '#admin_title': 'Loin 1: tenderloin'
          '#required_error': 'Loin 1: tenderloin is required.'
        loin_1_baby_back_ribs:
          '#type': radios
          '#title': Baby back ribs
          '#options': cut_sheet_keep_or_grind
          '#required': true
          '#states':
            visible:
              ':input[name="loin_1_cut"]':
                value: boneless
          '#admin_title': 'Loin 1: baby back ribs'
          '#required_error': 'Loin 1: baby back ribs is required.'
      loin_2:
        '#type': fieldset
        '#title': Loin 2
        '#attributes':
          class:
          - cut-sheet-part
        '#states':
          visible:
            ':input[name="hog_type"]':
              value: whole
            ':input[name="loins_same"]':
              unchecked: true
        loin_2_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_loin_cut
          '#required': true
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="loins_same"]':
                unchecked: true
          '#admin_title': 'Loin 2: cut'
          '#required_error': 'Loin 2: cut is required.'
        loin_2_chop_size:
          '#type': textfield
          '#title': Chop thickness and count per package
          '#placeholder': e.g. 1 inch thick, 2 per package
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="loins_same"]':
                unchecked: true
          '#admin_title': 'Loin 2: chop thickness and count per package'
        loin_2_tenderloin:
          '#type': radios
          '#title': Tenderloin
          '#options': cut_sheet_keep_or_grind
          '#required': true
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="loins_same"]':
                unchecked: true
              ':input[name="loin_2_cut"]':
                value: boneless
          '#admin_title': 'Loin 2: tenderloin'
          '#required_error': 'Loin 2: tenderloin is required.'
        loin_2_baby_back_ribs:
          '#type': radios
          '#title': Baby back ribs
          '#options': cut_sheet_keep_or_grind
          '#required': true
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="loins_same"]':
                unchecked: true
              ':input[name="loin_2_cut"]':
                value: boneless
          '#admin_title': 'Loin 2: baby back ribs'
          '#required_error': 'Loin 2: baby back ribs is required.'
    spare_ribs_panel:
      '#type': fieldset
      '#title': Spare ribs
      '#attributes':
        class:
        - cut-sheet-part
      spare_ribs:
        '#type': radios
        '#title': Spare ribs
        '#options': cut_sheet_spare_ribs
        '#required': true
        '#title_display': invisible
  card_shoulders:
    '#type': webform_section
    '#title': Shoulders
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    shoulder_help:
      '#type': webform_markup
      '#markup': '<p class="cut-sheet-help">Sizes are optional. Leave one blank and the processor uses its default.</p>'
    shoulders_same:
      '#type': checkbox
      '#title': Cut both shoulders the same way
      '#states':
        visible:
          ':input[name="hog_type"]':
            value: whole
    shoulder_pair:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      shoulder_1:
        '#type': fieldset
        '#title': Shoulder 1
        '#attributes':
          class:
          - cut-sheet-part
        shoulder_1_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_shoulder_cut
          '#required': true
          '#admin_title': 'Shoulder 1: cut'
          '#required_error': 'Shoulder 1: cut is required.'
        shoulder_1_size:
          '#type': textfield
          '#title': Size
          '#placeholder': e.g. steaks 1 inch thick, 2 per package; roast 3 lb; 4 ribs per pack
          '#description': Steak thickness and count, roast weight, or ribs per pack.
          '#admin_title': 'Shoulder 1: size'
      shoulder_2:
        '#type': fieldset
        '#title': Shoulder 2
        '#attributes':
          class:
          - cut-sheet-part
        '#states':
          visible:
            ':input[name="hog_type"]':
              value: whole
            ':input[name="shoulders_same"]':
              unchecked: true
        shoulder_2_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_shoulder_cut
          '#required': true
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="shoulders_same"]':
                unchecked: true
          '#admin_title': 'Shoulder 2: cut'
          '#required_error': 'Shoulder 2: cut is required.'
        shoulder_2_size:
          '#type': textfield
          '#title': Size
          '#placeholder': e.g. steaks 1 inch thick, 2 per package; roast 3 lb; 4 ribs per pack
          '#description': Steak thickness and count, roast weight, or ribs per pack.
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="shoulders_same"]':
                unchecked: true
          '#admin_title': 'Shoulder 2: size'
  card_hams:
    '#type': webform_section
    '#title': Hams
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    ham_help:
      '#type': webform_markup
      '#markup': '<p class="cut-sheet-help">Sizes are optional. Leave one blank and the processor uses its default.</p>'
    hams_same:
      '#type': checkbox
      '#title': Cut both hams the same way
      '#states':
        visible:
          ':input[name="hog_type"]':
            value: whole
    ham_pair:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      ham_1:
        '#type': fieldset
        '#title': Ham 1
        '#attributes':
          class:
          - cut-sheet-part
        ham_1_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_ham_cut
          '#required': true
          '#admin_title': 'Ham 1: cut'
          '#required_error': 'Ham 1: cut is required.'
        ham_1_size:
          '#type': textfield
          '#title': Steak thickness and count
          '#placeholder': e.g. 3/4 inch thick, 2 per package
          '#description': Only for steaks.
          '#states':
            visible:
            - ':input[name="ham_1_cut"]':
                value: fresh_steaks
            - or
            - ':input[name="ham_1_cut"]':
                value: cured_steaks
          '#admin_title': 'Ham 1: steak thickness and count'
      ham_2:
        '#type': fieldset
        '#title': Ham 2
        '#attributes':
          class:
          - cut-sheet-part
        '#states':
          visible:
            ':input[name="hog_type"]':
              value: whole
            ':input[name="hams_same"]':
              unchecked: true
        ham_2_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_ham_cut
          '#required': true
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="hams_same"]':
                unchecked: true
          '#admin_title': 'Ham 2: cut'
          '#required_error': 'Ham 2: cut is required.'
        ham_2_size:
          '#type': textfield
          '#title': Steak thickness and count
          '#placeholder': e.g. 3/4 inch thick, 2 per package
          '#description': Only for steaks.
          '#states':
            visible:
            - ':input[name="hog_type"]':
                value: whole
              ':input[name="hams_same"]':
                unchecked: true
              ':input[name="ham_2_cut"]':
                value: fresh_steaks
            - or
            - ':input[name="hog_type"]':
                value: whole
              ':input[name="hams_same"]':
                unchecked: true
              ':input[name="ham_2_cut"]':
                value: cured_steaks
          '#admin_title': 'Ham 2: steak thickness and count'
  card_bacon:
    '#type': webform_section
    '#title': Bacon and jowls
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    bacon_help:
      '#type': webform_markup
      '#markup': '<p class="cut-sheet-help">Sizes are optional. Leave one blank and the processor uses its default.</p>'
    bacon_same:
      '#type': checkbox
      '#title': Cut both bacon slabs the same way
      '#states':
        visible:
          ':input[name="hog_type"]':
            value: whole
    bacon_pair:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      bacon_1:
        '#type': fieldset
        '#title': Bacon slab 1
        '#attributes':
          class:
          - cut-sheet-part
        bacon_1_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_bacon_cut
          '#required': true
          '#admin_title': 'Slab 1: cut'
          '#required_error': 'Slab 1: cut is required.'
        bacon_1_slice_size:
          '#type': textfield
          '#title': Slice thickness and package size
          '#placeholder': e.g. regular slice, 1 lb packages
          '#admin_title': 'Slab 1: slice thickness and package size'
      bacon_2:
        '#type': fieldset
        '#title': Bacon slab 2
        '#attributes':
          class:
          - cut-sheet-part
        '#states':
          visible:
            ':input[name="hog_type"]':
              value: whole
            ':input[name="bacon_same"]':
              unchecked: true
        bacon_2_cut:
          '#type': radios
          '#title': Cut
          '#options': cut_sheet_bacon_cut
          '#required': true
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="bacon_same"]':
                unchecked: true
          '#admin_title': 'Slab 2: cut'
          '#required_error': 'Slab 2: cut is required.'
        bacon_2_slice_size:
          '#type': textfield
          '#title': Slice thickness and package size
          '#placeholder': e.g. regular slice, 1 lb packages
          '#states':
            visible:
              ':input[name="hog_type"]':
                value: whole
              ':input[name="bacon_same"]':
                unchecked: true
          '#admin_title': 'Slab 2: slice thickness and package size'
    jowl_panel:
      '#type': fieldset
      '#title': Jowl
      '#attributes':
        class:
        - cut-sheet-part
      jowl_cut:
        '#type': radios
        '#title': Jowl
        '#options': cut_sheet_jowl_cut
        '#required': true
        '#title_display': invisible
  card_organs:
    '#type': webform_section
    '#title': Heart and liver
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    organs_pair:
      '#type': container
      '#attributes':
        class:
        - cut-sheet-pair
      heart_panel:
        '#type': fieldset
        '#title': Heart
        '#attributes':
          class:
          - cut-sheet-part
        heart:
          '#type': radios
          '#title': Heart
          '#options': cut_sheet_heart
          '#required': true
          '#title_display': invisible
      liver_panel:
        '#type': fieldset
        '#title': Liver
        '#attributes':
          class:
          - cut-sheet-part
        liver:
          '#type': radios
          '#title': Liver
          '#options': cut_sheet_liver
          '#required': true
          '#title_display': invisible
  card_ground:
    '#type': webform_section
    '#title': Ground meat
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    ground_use:
      '#type': radios
      '#title': What should the ground meat become?
      '#options': cut_sheet_ground_use
      '#required': true
      '#default_value': ground_pork
    sausage_panel:
      '#type': fieldset
      '#title': Sausage
      '#attributes':
        class:
        - cut-sheet-part
      '#states':
        visible:
          ':input[name="ground_use"]':
            value: sausage
      sausage_types:
        '#type': checkboxes
        '#title': Which types?
        '#options': cut_sheet_sausage_type
        '#required': true
        '#description': Using more than one sausage type adds work for the processor.
        '#states':
          visible:
            ':input[name="ground_use"]':
              value: sausage
        '#admin_title': Sausage types
        '#required_error': Choose at least one sausage type.
      sausage_pair:
        '#type': container
        '#attributes':
          class:
          - cut-sheet-pair
        sausage_lb_breakfast_bag:
          '#type': number
          '#title': 'Breakfast sausage in bags: approximate pounds'
          '#required': true
          '#field_suffix': lb
          '#min': 0
          '#step': any
          '#states':
            visible:
              ':input[name="ground_use"]':
                value: sausage
              ':input[name="sausage_types[breakfast_bag]"]':
                checked: true
        sausage_lb_hot_breakfast_bag:
          '#type': number
          '#title': 'Hot breakfast sausage in bags: approximate pounds'
          '#required': true
          '#field_suffix': lb
          '#min': 0
          '#step': any
          '#states':
            visible:
              ':input[name="ground_use"]':
                value: sausage
              ':input[name="sausage_types[hot_breakfast_bag]"]':
                checked: true
        sausage_lb_smoked_sausage:
          '#type': number
          '#title': 'Smoked sausage: approximate pounds'
          '#required': true
          '#field_suffix': lb
          '#min': 10
          '#step': any
          '#description': The processor's minimum for this type is 10 lb.
          '#states':
            visible:
              ':input[name="ground_use"]':
                value: sausage
              ':input[name="sausage_types[smoked_sausage]"]':
                checked: true
        sausage_lb_fully_cooked_links:
          '#type': number
          '#title': 'Fully cooked links: approximate pounds'
          '#required': true
          '#field_suffix': lb
          '#min': 10
          '#step': any
          '#description': The processor's minimum for this type is 10 lb.
          '#states':
            visible:
              ':input[name="ground_use"]':
                value: sausage
              ':input[name="sausage_types[fully_cooked_links]"]':
                checked: true
        sausage_lb_raw_sausage:
          '#type': number
          '#title': 'Raw sausage: approximate pounds'
          '#required': true
          '#field_suffix': lb
          '#min': 10
          '#step': any
          '#description': The processor's minimum for this type is 10 lb.
          '#states':
            visible:
              ':input[name="ground_use"]':
                value: sausage
              ':input[name="sausage_types[raw_sausage]"]':
                checked: true
  card_notes:
    '#type': webform_section
    '#title': Anything else
    '#title_tag': h2
    '#attributes':
      class:
      - cut-sheet-card
    special_instructions:
      '#type': textarea
      '#title': Special instructions
      '#rows': 4
  network_check:
    '#type': value
    '#title': Network check
    '#value': ''
  actions:
    '#type': webform_actions
    '#title': Submit button(s)
